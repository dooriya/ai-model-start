[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = [
  "responses_common.py",
  "responses_example.py",
  "responses_features.py",
  "responses_weather.py",
]
