# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: foundry-models-starter
metadata:
  template: foundry-models-starter
infra:
  provider: bicep
  path: infra
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: |
        Write-Host "Updating managed values in .env..."
        $projectDir = if ($env:PROJECT_DIR) { $env:PROJECT_DIR } else { Get-Location }
        $envFile = Join-Path $projectDir ".env"
        $managed = [ordered]@{
          AZURE_AI_PROJECT_ENDPOINT = azd env get-value AZURE_AI_PROJECT_ENDPOINT
          AZURE_MODEL_DEPLOYMENT_NAME = azd env get-value AZURE_MODEL_DEPLOYMENT_NAME
        }
        $lines = if (Test-Path $envFile) { @(Get-Content -Path $envFile) } else { @() }
        $seen = @{}
        $updated = foreach ($line in $lines) {
          if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=') {
            $key = $matches[1]
            if ($managed.Contains($key)) {
              if (-not $seen.ContainsKey($key)) {
                $seen[$key] = $true
                "$key=$($managed[$key])"
              }
              continue
            }
          }
          $line
        }
        foreach ($key in $managed.Keys) {
          if (-not $seen.ContainsKey($key)) {
            $updated += "$key=$($managed[$key])"
          }
        }
        $newContent = ($updated -join [Environment]::NewLine) + [Environment]::NewLine
        $oldContent = if (Test-Path $envFile) { Get-Content -Raw -Path $envFile } else { "" }
        if ($oldContent -ne $newContent) {
          Set-Content -Path $envFile -Value $newContent -Encoding utf8 -NoNewline
        }
        Write-Host ".env managed values are current"
    posix:
      shell: sh
      run: |
        echo "Updating managed values in .env..."
        envFile="${PROJECT_DIR:-.}/.env"
        endpoint="$(azd env get-value AZURE_AI_PROJECT_ENDPOINT)"
        model="$(azd env get-value AZURE_MODEL_DEPLOYMENT_NAME)"
        touch "$envFile"
        tmpFile="$(mktemp "${envFile}.XXXXXX")"
        awk -v endpoint="$endpoint" -v model="$model" '
          BEGIN { seen_endpoint = 0; seen_model = 0 }
          /^AZURE_AI_PROJECT_ENDPOINT=/ {
            if (!seen_endpoint) print "AZURE_AI_PROJECT_ENDPOINT=" endpoint
            seen_endpoint = 1
            next
          }
          /^AZURE_MODEL_DEPLOYMENT_NAME=/ {
            if (!seen_model) print "AZURE_MODEL_DEPLOYMENT_NAME=" model
            seen_model = 1
            next
          }
          { print }
          END {
            if (!seen_endpoint) print "AZURE_AI_PROJECT_ENDPOINT=" endpoint
            if (!seen_model) print "AZURE_MODEL_DEPLOYMENT_NAME=" model
          }
        ' "$envFile" > "$tmpFile"
        if cmp -s "$tmpFile" "$envFile"; then
          rm "$tmpFile"
        else
          mv "$tmpFile" "$envFile"
        fi
        echo ".env managed values are current"
